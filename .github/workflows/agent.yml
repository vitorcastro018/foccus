name: Agente Windows

on:
  push:
    paths: ["agent/**", ".github/workflows/agent.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publicar Foccus.exe (single-file, self-contained)
        run: >
          dotnet publish agent/Foccus.Agent -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: Foccus-agent-win-x64
          path: out/Foccus.exe
